name: Release

# Publishes @nectar-js/nectar and @nectar-js/create at the versions on the branch. Bump them
# with `pnpm changeset version` and push before running this.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm --filter basic run build
      - run: pnpm --filter javascript run build
      - run: pnpm --filter tickets run build
      - run: pnpm --filter i18n-example run build

      - run: pnpm test

      - run: pnpm typecheck

      # Skips any version that is already on npm.
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
